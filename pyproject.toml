[project]
name = "dr-xai"
version = "1.0.0"
description = "Closed-form causal attribution for diabetic retinopathy grading from the attention-pooling head of a vision transformer (submitted to ISBI 2027)"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.12"
# pinned to the environment that produced the paper's results
dependencies = [
    "huggingface-hub==1.33.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "timm==1.0.30",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
package = false
